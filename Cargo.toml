[package]
name = "openenisa"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The open-source CSAF 2.0 & ENISA reporting engine for DevOps: SBOM-driven vulnerability triage with VEX and CRA-ready reporting."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/daikiito-dk/Openenisa"
homepage = "https://github.com/daikiito-dk/Openenisa"
keywords = ["csaf", "vex", "sbom", "cyclonedx", "spdx"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "openenisa"
path = "src/lib.rs"

[[bin]]
name = "openenisa"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
jsonschema = { version = "0.58.6", default-features = false }
quick-xml = "0.42.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"

[profile.release]
lto = "thin"
strip = true
